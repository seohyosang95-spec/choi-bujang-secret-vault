<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 인증된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin-top: 0; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    section { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #162538; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #bfd0e5; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; padding: 11px 12px; color: #ecf4ff; background: #101a28; border: 1px solid #6b8198; border-radius: 9px; }
    textarea { min-height: 110px; resize: vertical; }
    button { padding: 10px 14px; border: 0; border-radius: 9px; cursor: pointer; color: #0b1b25; background: #8ad8df; font-weight: 700; }
    button.secondary { color: #ecf4ff; background: #435a72; }
    button.danger { color: #ffe3e8; background: #7b3140; }
    button:disabled { cursor: wait; opacity: .6; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .status { min-height: 1.5em; color: #ffd3dc; }
    .session { color: #99e4b6; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { display: block; color: #bfd0e5; white-space: pre-wrap; }
    li .row { margin-top: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>인증된 자료실</h1>
    <p>Supabase Auth로 로그인한 사용자만 서버 자료 API를 호출할 수 있습니다.</p>

    <section id="login-panel">
      <h2>이메일 로그인</h2>
      <form id="login-form">
        <label>이메일<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <p id="login-error" class="status" role="alert" aria-live="polite"></p>
    </section>

    <section id="session-panel" hidden>
      <div class="row">
        <strong id="session-state" class="session">로그인됨</strong>
        <button id="logout" class="secondary" type="button">로그아웃</button>
      </div>
    </section>

    <section id="editor-panel" hidden>
      <h2 id="editor-title">메모 추가</h2>
      <form id="note-form">
        <input id="note-id" type="hidden">
        <label>제목<input id="note-title" maxlength="200" required></label>
        <label>본문<textarea id="note-body" maxlength="10000" required></textarea></label>
        <div class="row">
          <button type="submit">저장</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="note-error" class="status" role="alert" aria-live="polite"></p>
    </section>

    <section id="notes-panel" hidden>
      <h2>가상 메모</h2>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2?bundle';
    import { SUPABASE_PUBLISHABLE_KEY, SUPABASE_URL } from './auth-config.js';

    const loginPanel = document.querySelector('#login-panel');
    const loginForm = document.querySelector('#login-form');
    const loginError = document.querySelector('#login-error');
    const sessionPanel = document.querySelector('#session-panel');
    const sessionState = document.querySelector('#session-state');
    const editorPanel = document.querySelector('#editor-panel');
    const noteForm = document.querySelector('#note-form');
    const noteId = document.querySelector('#note-id');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteError = document.querySelector('#note-error');
    const notesPanel = document.querySelector('#notes-panel');
    const notesList = document.querySelector('#notes');
    const cancelEdit = document.querySelector('#cancel-edit');

    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      loginError.textContent = '공개 Supabase Project URL과 publishable key를 먼저 설정해 주세요.';
      loginForm.querySelector('button').disabled = true;
    } else {
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      let session = null;

      const resetEditor = () => {
        noteForm.reset();
        noteId.value = '';
        document.querySelector('#editor-title').textContent = '메모 추가';
        cancelEdit.hidden = true;
      };

      const api = async (path = '', options = {}) => {
        if (!session?.access_token) throw new Error('로그인이 필요합니다.');
        const response = await fetch(`/api/notes${path}`, {
          ...options,
          cache: 'no-store',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.access_token}`,
            ...options.headers,
          },
        });
        const body = response.status === 204 ? null : await response.json().catch(() => null);
        if (!response.ok) throw new Error(body?.error ?? `자료 요청 실패 (HTTP ${response.status})`);
        return body;
      };

      const loadNotes = async () => {
        noteError.textContent = '';
        notesList.replaceChildren();
        try {
          const notes = await api();
          if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
          if (!notes.length) {
            const empty = document.createElement('li');
            empty.textContent = '저장된 메모가 없습니다.';
            notesList.append(empty);
            return;
          }
          notesList.append(...notes.map(note => {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            const content = document.createElement('span');
            const actions = document.createElement('div');
            const edit = document.createElement('button');
            const remove = document.createElement('button');
            title.textContent = note.title;
            content.textContent = note.body;
            actions.className = 'row';
            edit.type = 'button';
            edit.textContent = '수정';
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = '삭제';
            edit.addEventListener('click', () => {
              noteId.value = note.id;
              noteTitle.value = note.title;
              noteBody.value = note.body;
              document.querySelector('#editor-title').textContent = '메모 수정';
              cancelEdit.hidden = false;
              noteTitle.focus();
            });
            remove.addEventListener('click', async () => {
              if (!window.confirm('이 메모를 삭제할까요?')) return;
              try {
                await api(`/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
                if (noteId.value === note.id) resetEditor();
                await loadNotes();
              } catch (error) {
                noteError.textContent = error.message;
              }
            });
            actions.append(edit, remove);
            item.append(title, content, actions);
            return item;
          }));
        } catch (error) {
          noteError.textContent = error.message;
        }
      };

      const renderSession = async (nextSession) => {
        session = nextSession;
        const signedIn = Boolean(session?.access_token);
        loginPanel.hidden = signedIn;
        sessionPanel.hidden = !signedIn;
        editorPanel.hidden = !signedIn;
        notesPanel.hidden = !signedIn;
        loginError.textContent = '';
        noteError.textContent = '';
        resetEditor();
        notesList.replaceChildren();
        if (signedIn) {
          sessionState.textContent = '로그인됨';
          await loadNotes();
        }
      };

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        loginError.textContent = '';
        const submit = loginForm.querySelector('button');
        submit.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: document.querySelector('#email').value,
          password: document.querySelector('#password').value,
        });
        submit.disabled = false;
        if (error) loginError.textContent = error.message;
      });

      document.querySelector('#logout').addEventListener('click', async () => {
        noteError.textContent = '';
        const { error } = await supabase.auth.signOut();
        if (error) noteError.textContent = error.message;
      });

      noteForm.addEventListener('submit', async event => {
        event.preventDefault();
        noteError.textContent = '';
        const id = noteId.value;
        try {
          await api(id ? `/${encodeURIComponent(id)}` : '', {
            method: id ? 'PUT' : 'POST',
            body: JSON.stringify({ title: noteTitle.value, body: noteBody.value }),
          });
          resetEditor();
          await loadNotes();
        } catch (error) {
          noteError.textContent = error.message;
        }
      });

      cancelEdit.addEventListener('click', resetEditor);
      supabase.auth.onAuthStateChange((_event, nextSession) => { void renderSession(nextSession); });
      const { data, error } = await supabase.auth.getSession();
      if (error) loginError.textContent = error.message;
      await renderSession(data?.session ?? null);
    }
  </script>
</body>
</html>
